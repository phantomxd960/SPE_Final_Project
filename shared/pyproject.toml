[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regdiff-common"
version = "0.1.0"
description = "Shared configuration, logging, database models, embeddings, retrieval and graph code for RegulationDiff"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "networkx==3.4.2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
fastembed = ["fastembed==0.4.2"]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4"]

[tool.setuptools.packages.find]
include = ["regdiff_common*"]

