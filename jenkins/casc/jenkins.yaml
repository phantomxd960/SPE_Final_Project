# Jenkins Configuration as Code: admin user, credentials, global settings and the
# pipeline job are created at start-up, with no setup wizard.
# Secret values are read from files mounted under /run/secrets (jenkins/secrets/, git-ignored).
jenkins:
  systemMessage: "RegulationDiff CI/CD"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${readFile:/run/secrets/jenkins-admin-password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: DOCKERHUB_NAMESPACE
            value: "${DOCKERHUB_NAMESPACE}"
          - key: K8S_FLAVOUR
            value: "${K8S_FLAVOUR}"
          - key: LLM_MODE
            value: "${LLM_MODE}"
          - key: LLM_MODEL
            value: "${LLM_MODEL}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub-credentials
              description: Docker Hub access token
              username: "${DOCKERHUB_NAMESPACE}"
              password: "${readFile:/run/secrets/dockerhub-token}"
          - file:
              scope: GLOBAL
              id: kubeconfig
              description: Access to the target Kubernetes cluster
              fileName: config
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig}"

unclassified:
  location:
    url: "http://localhost:8090/"

jobs:
  - script: |
      pipelineJob('regulationdiff') {
        description('Build, test, scan, push and deploy RegulationDiff on every push to main.')
        properties {
          pipelineTriggers {
            triggers {
              githubPush()
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPOSITORY_URL}') }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile')
            lightweight(true)
          }
        }
      }
