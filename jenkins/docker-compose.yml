# Run Jenkins locally:  docker compose -f jenkins/docker-compose.yml up -d --build
# Then open http://localhost:8081 (initial password: docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword)
name: jenkins

services:
  jenkins:
    build: .
    container_name: jenkins
    user: root  # needed to use the host Docker socket on Docker Desktop
    ports:
      - "8081:8080"
    environment:
      DOCKERHUB_NAMESPACE: ${DOCKERHUB_NAMESPACE:-regulationdiff}
      K8S_FLAVOUR: ${K8S_FLAVOUR:-docker-desktop}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  jenkins_home:
