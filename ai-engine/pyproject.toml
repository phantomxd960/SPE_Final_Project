[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regdiff-ai"
version = "0.1.0"
description = "RegulationDiff ai-worker: clause extraction, change detection, dependency graph and LLM impact reports"
requires-python = ">=3.11"
dependencies = [
    "regdiff-common",
    "pymupdf==1.25.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4"]

[project.scripts]
regdiff-worker = "regdiff_ai.worker:main"

[tool.setuptools.packages.find]
include = ["regdiff_ai*"]

