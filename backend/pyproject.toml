[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regdiff-api"
version = "0.1.0"
description = "RegulationDiff backend: REST API, authentication, uploads and job management"
requires-python = ">=3.11"
dependencies = [
    "regdiff-common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "alembic==1.14.0",
    "bcrypt==4.2.1",
    "PyJWT==2.10.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "httpx==0.28.1", "ruff==0.8.4"]

[tool.setuptools.packages.find]
include = ["regdiff_api*"]

[tool.setuptools.package-data]
regdiff_api = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

