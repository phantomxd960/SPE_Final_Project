# Alembic CLI configuration for developers (`alembic revision -m "..."`).
# The running backend applies migrations itself at start-up (regdiff_api/bootstrap.py).
[alembic]
script_location = regdiff_api/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
