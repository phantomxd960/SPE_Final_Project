# Rendered as /vault/secrets/app.env; the image entrypoint sources it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: regulationdiff
        vault.hashicorp.com/agent-inject-secret-app.env: secret/data/regulationdiff/app
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{- with secret "secret/data/regulationdiff/app" -}}
          export DB_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          export JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
          export ADMIN_PASSWORD="{{ .Data.data.ADMIN_PASSWORD }}"
          export LLM_API_KEY="{{ .Data.data.LLM_API_KEY }}"
          {{- end }}
