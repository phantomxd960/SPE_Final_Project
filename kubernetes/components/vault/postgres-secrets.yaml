# PostgreSQL reads its password from the file rendered by the Vault agent.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: regulationdiff
        vault.hashicorp.com/agent-inject-secret-db-password: secret/data/regulationdiff/app
        vault.hashicorp.com/agent-inject-template-db-password: |
          {{- with secret "secret/data/regulationdiff/app" -}}{{ .Data.data.DB_PASSWORD }}{{- end }}
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: /vault/secrets/db-password
