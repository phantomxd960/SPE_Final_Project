# / -> frontend, /api -> backend. *.localhost resolves to 127.0.0.1 in browsers and curl, so no hosts-file edit is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regulationdiff
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
spec:
  ingressClassName: nginx
  rules:
    - host: regulationdiff.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
