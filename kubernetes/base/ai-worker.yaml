# ai-worker: polls the PostgreSQL job queue. On SIGTERM it finishes the current
# job before exiting, hence the long grace period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: ai-worker }
  template:
    metadata:
      labels: { app: ai-worker }
    spec:
      serviceAccountName: ai-worker
      terminationGracePeriodSeconds: 120
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: ai-worker
          image: regulationdiff-ai-worker
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: regulationdiff-secrets, optional: true }
          ports:
            - { containerPort: 8001, name: health }
          readinessProbe:
            httpGet: { path: /health, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false }
          volumeMounts:
            - { name: documents, mountPath: /data/documents }
      volumes:
        - name: documents
          persistentVolumeClaim: { claimName: documents }
