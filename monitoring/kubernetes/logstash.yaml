# Logstash: parses the JSON application logs (pipeline lives in monitoring/logstash/pipeline/
# and is loaded into the ConfigMap by the Ansible monitoring role).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels: { app: logstash }
  template:
    metadata:
      labels: { app: logstash }
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.15.3
          env:
            - { name: LS_JAVA_OPTS, value: "-Xms256m -Xmx256m" }
            - { name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200" }
            - { name: XPACK_MONITORING_ENABLED, value: "false" }
          ports:
            - { containerPort: 5044, name: beats }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: pipeline, mountPath: /usr/share/logstash/pipeline }
      volumes:
        - name: pipeline
          configMap: { name: logstash-pipeline }
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: logging
spec:
  selector: { app: logstash }
  ports:
    - { port: 5044, targetPort: beats, name: beats }
