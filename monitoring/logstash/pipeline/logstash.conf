# Filebeat -> Logstash -> Elasticsearch (DEV-10, Section 5.3).
# Application services write one JSON object per line; Logstash parses and enriches them.

input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat adds an ECS "event" object; the application uses "event" as a plain
  # string (the event name). Drop Filebeat's version so the two never collide.
  mutate { remove_field => ["event"] }

  # Parse structured application logs; anything else is kept as plain text.
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  if [app][service] {
    # Promote the agreed fields to the top level so Kibana can chart them directly.
    mutate {
      rename => {
        "[app][service]"      => "service"
        "[app][level]"        => "level"
        "[app][event]"        => "event"
        "[app][request_id]"   => "request_id"
        "[app][build_number]" => "build_number"
        "[app][duration_ms]"  => "duration_ms"
        "[app][status]"       => "status"
        "[app][document_id]"  => "document_id"
        "[app][message]"      => "log_message"
      }
    }
    date {
      match  => ["[app][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
    mutate {
      convert => { "duration_ms" => "float" }
      add_field => { "log_type" => "application" }
      remove_field => ["message", "[app][timestamp]"]
    }
  } else {
    mutate { add_field => { "log_type" => "system" } }
  }

  # Derived flags used by the Kibana dashboards.
  if [event] == "http_request" {
    if [status] and [status] >= 500 {
      mutate { add_field => { "outcome" => "error" } }
    } else {
      mutate { add_field => { "outcome" => "success" } }
    }
  }
  if [event] in ["job_failed", "impact_llm_failed", "impact_output_rejected", "unhandled_error"] {
    mutate { add_field => { "outcome" => "error" } }
  }

  # "status" is an HTTP code for requests but a word ("done", "failed") for jobs:
  # index it as text everywhere, after the numeric check above has used it.
  mutate { convert => { "status" => "string" } }

  mutate { remove_field => ["agent", "ecs", "input", "log", "host"] }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "regulationdiff-%{+YYYY.MM.dd}"
  }
}
